# render.yaml - Render Cloud Deployment Specification
services:
  # 1. FastAPI Web Service
  - type: web
    name: cyber-radar-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cyber-radar-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production

# 2. Managed PostgreSQL Database
databases:
  - name: cyber-radar-db
    databaseName: port_scanner
    user: scanner_user
