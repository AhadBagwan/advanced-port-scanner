services:
  - type: web
    name: cyber-radar-port-scanner
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: "sqlite:///./port_scanner.db"
      - key: SECRET_KEY
        value: "cyber-radar-secret-key-prod-2026"
      - key: ENVIRONMENT
        value: "production"
