version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:13-alpine
    container_name: port_scanner_db
    environment:
      POSTGRES_USER: scanner_user
      POSTGRES_PASSWORD: scanner_password
      POSTGRES_DB: port_scanner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scanner_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: port_scanner_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scanner_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: port_scanner_api
    environment:
      DATABASE_URL: postgresql://scanner_user:scanner_password@postgres:5432/port_scanner
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: your-secret-key-change-this-in-production
      DEBUG: "False"
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    networks:
      - scanner_network
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: port_scanner_celery
    environment:
      DATABASE_URL: postgresql://scanner_user:scanner_password@postgres:5432/port_scanner
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    networks:
      - scanner_network
    command: celery -A app.tasks.scanning worker --loglevel=info

volumes:
  postgres_data:
  redis_data:
  backend_logs:

networks:
  scanner_network:
    driver: bridge
